<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" /><title>Job Parser v1 (Fixed Soi & Areas)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary-color:#007bff;--secondary-color:#28a745;--background-light:#f7f7f7;--background-white:#fff;--text-color:#000;--border-radius:8px;--danger:#dc3545}
        body{font-family:'Kanit',sans-serif;background:var(--background-light);padding:20px;color:var(--text-color);max-width:1200px;margin:0 auto}
        h1{color:var(--primary-color);font-weight:700;margin-bottom:15px;padding-bottom:8px;border-bottom:3px solid var(--primary-color);display:inline-block;font-size:24px;cursor:pointer;user-select:none}
        h2{color:#495057;font-weight:600;margin-top:20px;margin-bottom:10px}
        #maintenance-screen{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:9998;flex-direction:column;align-items:center;justify-content:center;text-align:center}
        #admin-panel{display:none;background:#fff3cd;padding:15px;border-radius:var(--border-radius);margin-bottom:20px;border:1px solid #ffeeba;text-align:center}
        #secret-admin-btn{position:fixed;bottom:0;right:0;width:40px;height:40px;background:rgba(0,0,0,0.01);z-index:9999;cursor:pointer}
        .input-section{display:flex;flex-direction:column}
        .input-control-wrapper{display:flex;gap:15px;align-items:flex-end}
        textarea{height:200px;font-family:'Kanit',monospace;padding:10px;border:1px solid #ced4da;border-radius:var(--border-radius);box-shadow:inset 0 1px 3px rgba(0,0,0,.06);resize:vertical;width:100%}
        button{padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;border:none;border-radius:var(--border-radius);transition:all .2s ease-in-out;white-space:nowrap;touch-action:manipulation}
        #btnProcess{background-color:var(--primary-color);color:white}
        #btnPDF,#btnSharePDF,.short-out-section .control-group button,#btnPreviewSheet{background-color:var(--secondary-color);color:white}
        #short-out-container{background:var(--background-white);padding:0;border-radius:var(--border-radius);border:1px solid #dee2e6;margin:10px 0}
        .job-item{border-bottom:1px dashed #ddd;padding:4px 0}
        .job-text{font-size:17px;line-height:1.25;white-space:pre-wrap}
        #preview-container{display:flex;flex-direction:column;gap:15px;margin-top:15px;width:100%;overflow-x:auto;background:#e9ecef;padding:10px;border-radius:var(--border-radius);align-items:center}
        .page-wrap{width:842px;height:595px;min-width:842px;background:white;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;border:none;box-shadow:none;position:relative;margin-bottom:20px}
        .slot{box-sizing:border-box;padding:15px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;position:relative}
        .line-top{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
        .line-top>div:first-child{font-size:24px;font-weight:900}
        .passenger{text-align:center;margin-top:15px;margin-bottom:8px;font-size:22px;font-weight:700;}
        .route{text-align:center;font-size:16px;margin:0 0 35px 0}
        .code{position:absolute;right:15px;bottom:10px;font-size:18px;font-weight:700}
        @media (max-width:900px){.input-control-wrapper{flex-direction:column;align-items:stretch!important}.page-wrap{zoom:0.45}button{width:100%}}
    </style>
</head>
<body>
    <div id="secret-admin-btn"></div>
    <div id="maintenance-screen"><h1 style="color:var(--danger)">🛠️ ปิดปรับปรุงชั่วคราว</h1><p>กำลังอัปเดตระบบ กรุณาลองใหม่ภายหลัง</p></div>
    <h1 id="webHeader"> 📄 แปลงใบงาน 📋</h1>
    <div id="admin-panel"><strong>⚙️ แผงควบคุมระบบ</strong><br>สถานะ: <span id="status-text"></span><br><button id="toggle-system" style="background:var(--danger);color:white;margin-top:5px;">เปิด/ปิด การใช้งานระบบ</button></div>
    <div class="input-section"><div class="input-control-wrapper"><textarea id="input" placeholder="วางข้อมูลใบงาน..."></textarea><div class="control-group"><button id="btnProcess">⚙️ แปลงใบงาน</button></div></div></div><hr>
    <div class="short-out-section"><h2>✅ ผลลัพธ์แบบย่อ (ส่งLINE)</h2><button onclick="copyShort()" style="background-color: #e91e63; color: white;">✂️ คัดลอกแบบย่อส่ง LINE</button><div id="short-out-container">ผลลัพธ์จะแสดงที่นี่...</div></div>
    <h2>🖨️ ใบงาน (STB)</h2>
    <div class="control-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><button id="btnPreviewSheet">👀 ตัวอย่าง (PDF)</button><button id="btnPDF">💾 ดาวน์โหลด PDF</button><button id="btnSharePDF" style="grid-column:span 2">🔗 แชร์ PDF</button></div>
    <div id="preview-container"></div>
    
    <script>
        const WEB_APP_URL='https://script.google.com/macros/s/AKfycbz889F8LVJ7RxEIWJTFCHhxi89qriCSQT86m9UgFY5lN_H5UV0LSYrnKvnbhKC_RPmxdA/exec';
        let PutterName=localStorage.getItem("lastPutter")||"",isAdmin=localStorage.getItem("isAdmin")==="true",isSystemActive=localStorage.getItem("sys_active")!=="false";
        
        // --- ฐานข้อมูล ถนนและเขต (เพิ่มหนักๆ ตามคำขอ) ---
        const thaiMap = {
            "charoen krung": "เจริญกรุง", "bangkorlaem": "บางคอแหลม", "bang kho laem": "บางคอแหลม",
            "sathon": "สาทร", "ratchadamri": "ราชดำริ", "ratchada": "รัชดา", "silom": "สีลม",
            "sukhumvit": "สุขุมวิท", "phetchaburi": "เพชรบุรี", "lang suan": "หลังสวน",
            "pathum wan": "ปทุมวัน", "phaya thai": "พญาไท", "huai khwang": "ห้วยขวาง",
            "bang rak": "บางรัก", "khlong toei": "คลองเตย", "wattana": "วัฒนา", "watthana": "วัฒนา",
            "prawet": "ประเวศ", "bang na": "บางนา", "suan luang": "สวนหลวง", "yan nawa": "ยานนาวา",
            "chatuchak": "จตุจักร", "don mueang": "ดอนเมือง", "lat phrao": "ลาดพร้าว", "thong lo": "ทองหล่อ", "ekkamai": "เอกมัย",
            "asoke": "อโศก", "din daeng": "ดินแดง", "phra khanong": "พระโขนง", "bang kapi": "บางกะปิ",
            "wang thonglang": "วังทองหลาง", "lat krabang": "ลาดกระบัง", "bueng kum": "บึงกุ่ม", "min buri": "มีนบุรี",
            "khan na yao": "คันนายาว", "saphan sung": "สะพานสูง", "nong chok": "หนองจอก", "sai mai": "สายไหม",
            "lak si": "หลักสี่", "bang khen": "บางเขน", "bang sue": "บางซื่อ", "dusit": "ดุสิต",
            "phra nakhon": "พระนคร", "pom prap": "ป้อมปราบ", "samphanthawong": "สัมพันธวงศ์", "thung khru": "ทุ่งครุ",
            "rat burana": "ราษฎร์บูรณะ", "chom thong": "จอมทอง", "bang khun thian": "บางขุนเทียน", "bang bon": "บางบอน",
            "phasi charoen": "ภาษีเจริญ", "bang khae": "บางแค", "nong khaem": "หนองแขม", "taling chan": "ตลิ่งชัน",
            "thawi watthana": "ทวีวัฒนา", "bang phlat": "บางพลัด", "bangkok noi": "บางกอกน้อย", "bangkok yai": "บางกอกใหญ่",
            "khlong san": "คลองสาน", "thana si": "ตะนาวศรี", "bamrung mueang": "บำรุงเมือง", "yaowarat": "เยาวราช",
            "sanam bin nam": "สนามบินน้ำ", "tiwanon": "ติวานนท์", "chaeng watthana": "แจ้งวัฒนะ", "ngam wong wan": "งามวงศ์วาน",
            "prachachuen": "ประชาชื่น", "rattanathibet": "รัตนาธิเบศร์", "kanchanaphisek": "กาญจนาภิเษก", "srinakarin": "ศรีนครินทร์"
        };

        const ZIP_MAP = {
            "10100":"ป้อมปราบ/เยาวราช","10110":"วัฒนา/อโศก","10120":"บางคอแหลม/ยานนาวา","10140":"ราษฎร์บูรณะ","10150":"จอมทอง/บางขุนเทียน",
            "10160":"บางแค/หนองแขม","10170":"ตลิ่งชัน/ทวีวัฒนา","10200":"พระนคร/ราชดำเนิน","10210":"ดอนเมือง/หลักสี่","10220":"สายไหม/บางเขน",
            "10230":"คันนายาว/บึงกุ่ม","10240":"บางกะปิ","10250":"สวนหลวง/ประเวศ","10260":"บางนา/อุดมสุข","10270":"สมุทรปราการ/เมือง",
            "10310":"ห้วยขวาง/รัชดา","10330":"ปทุมวัน/สยาม","10400":"พญาไท/พหลโยธิน","10500":"บางรัก/สีลม","10510":"มีนบุรี/หนองจอก",
            "10520":"ลาดกระบัง","10540":"บางพลี/กิ่งแก้ว","10600":"คลองสาน/ธนบุรี","10700":"บางพลัด/บางกอกน้อย","10800":"บางซื่อ/เตาปูน",
            "10900":"จตุจักร/ลาดยาว","11000":"เมืองนนทบุรี","11110":"บางบัวทอง","11120":"ปากเกร็ด","11130":"บางกรวย","11140":"บางใหญ่",
            "12000":"เมืองปทุมธานี","12120":"คลองหลวง","12130":"รังสิต/ธัญบุรี","12150":"คูคต/ลำลูกกา"
        };

function getAreaForShort(text){
    if(!text) return "ระบุพื้นที่";
    const t = text.toLowerCase().replace(/langsuan/g,'lang suan');
    if(/dmk|don mueang|ดอนเมือง/i.test(t)) return "แอร์ดอน";
    if(/bkk|suvarnabhumi|สุวรรณภูมิ/i.test(t)) return "แอร์สุ";

    for (const [eng, thai] of Object.entries(thaiMap)) {
        if (t.includes(eng) || t.includes(thai)) {
            let label = thai;
            const ramaMatch = t.match(/rama\s*(\d+)|พระราม\s*(\d+)/i);
            if (ramaMatch) label = "พระราม " + (ramaMatch[1] || ramaMatch[2]);
            const soiRegex = new RegExp(`(?:${eng}|${thai}|ซอย|ซ\\.|soi)\\s*([\\d\\/\\-]+)`, 'i');
            const soiMatch = t.match(soiRegex);
            if (soiMatch) {
                return label + " " + soiMatch[1];
            }
            return label; 
        }
    }

    const zipMatch = t.match(/\b(\d{5})\b/);
    if (zipMatch && ZIP_MAP[zipMatch[1]]) return ZIP_MAP[zipMatch[1]];

    let f = text.split(/[,\(\n]/)[0].trim().replace(/^\d+[\/\d\-]*\s+/, "");
    return (f.length > 25 ? f.substring(0, 25) : f) || "กทม.";
}

        function updateUI(){document.getElementById("maintenance-screen").style.display=(isSystemActive||isAdmin)?"none":"flex";document.getElementById("admin-panel").style.display=isAdmin?"block":"none";const st=document.getElementById("status-text");if(st){st.innerText=isSystemActive?"🟢 เปิดใช้งานปกติ":"🔴 ปิดระบบ";st.style.color=isSystemActive?"green":"red"}}
        document.getElementById("secret-admin-btn").ondblclick=()=>{isAdmin=!isAdmin;localStorage.setItem("isAdmin",isAdmin);alert(isAdmin?"🔓 โหมด Admin: เปิด":"🔒 โหมด Admin: ปิด");updateUI()};
        document.getElementById("toggle-system").onclick=()=>{isSystemActive=!isSystemActive;localStorage.setItem("sys_active",isSystemActive);updateUI()};
        updateUI();

        const MAP=t=>{if(!t)return"BK";const x=t.toLowerCase();return/bkk|suvarn|สุวรรณ/.test(x)?"S":/dmk|don m|ดอนเมือง/.test(x)?"D":/pathum thani|ปทุมธานี/.test(x)?"PT":/nonthaburi|นนทบุรี/.test(x)?"NB":/samut p|สมุทรปราการ/.test(x)?"SP":"BK"};
        function mapsLink(a){if(!a)return"#";let q=a.replace(/'/g,"").replace(/\n/g," ");const t=a.toLowerCase();if(/suvarnabhumi|bkk|สุวรรณภูมิ/.test(t))q="Suvarnabhumi Airport";if(/don mueang|dmk|ดอนเมือง/.test(t))q="Don Mueang Airport";return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`}
        function getVal(t,k){const m=t.match(new RegExp("【"+k+"】([^\\n]*)"));return m?m[1].trim():""}
        function shortName(n){if(!n)return"";let c=n.split("(")[0].trim();const w=c.match(/[\wก-๙\u4e00-\u9fff]+/g)||[];return w.slice(0,3).join(" ")}
        function getCode(b){const raw=b.match(/【接驳编码code】(.*)/)||b.match(/code[:：]?\s*(.*)/i);if(!raw)return"";return raw[1].trim().match(/[0-9A-Za-z]+/)?.[0]||""}
        
        function getAllJobData(){
            const v=document.getElementById("input").value;
            if(!v.trim())return[];
            const bs=v.split(/\n(?=[A-Z]{1,2}\d{2,5}(?:-\d{1,2})?)/).filter(x=>x.trim()&&x.includes('วันที่'));
            return bs.map(b=>({
                id:(b.match(/^([A-Z]{1,2}\d{2,5}(?:-\d{1,2})?)/m)||[""])[0],
                time:getVal(b,"时间เวลา"),
                flight:getVal(b,"航班flight"),
                pk:getVal(b,"接รับ"),
                dp:getVal(b,"送ส่ง"),
                name:getVal(b,"姓名ชื่อ"),
                seat: (function(b){
                    const t = b.toLowerCase();
                    if(t.includes("camryor7seat")) return "C7";
                    if(t.includes("7seat")) return "7";
                    if(t.includes("5seat")) return "5";
                    return /7\s*seat/i.test(b)?7:5;
                })(b),
                mapFrom:MAP(getVal(b,"接รับ")),
                mapTo:MAP(getVal(b,"送ส่ง")),
                areaFrom:getAreaForShort(getVal(b,"接รับ")),
                areaTo:getAreaForShort(getVal(b,"送ส่ง")),
                date:getVal(b,"日期วันที่"),
                code:getCode(b)
            }));
        }

        function renderShortOut(){const jd=getAllJobData(),container=document.getElementById("short-out-container");if(!jd.length)return;jd.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));let html="",currentDate="";jd.forEach(j=>{if(j.date!==currentDate){currentDate=j.date;html+=`<div style="margin-top:12px;font-weight:600;color:var(--primary-color);font-size:16px;">📅 ${currentDate}</div>`}html+=`<div class="job-item"><div class="job-text">${j.id}//${j.time}//#${j.seat}${j.mapFrom}-${j.mapTo}\n<a href="${mapsLink(j.pk)}" target="_blank" style="color:#007bff;text-decoration:none">📍 ${j.areaFrom}</a>→<a href="${mapsLink(j.dp)}" target="_blank" style="color:#28a745;text-decoration:none">📍 ${j.areaTo}</a>${j.flight?' ✈️'+j.flight:''}</div></div>`});container.innerHTML=html}
        function copyShort(){const jd=getAllJobData();if(!jd.length){alert("ไม่มีข้อมูล");return}jd.sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));let out="",currentDate="";jd.forEach(j=>{if(j.date!==currentDate){currentDate=j.date;out+=`\n${currentDate}\n====================\n`}out+=`${j.id}//${j.time}//#${j.seat}${j.mapFrom}-${j.mapTo}\n${j.areaFrom}–${j.areaTo}${j.flight?' ✈️'+j.flight:''}\n\n`});const ta=document.createElement("textarea");ta.value=out.trim();document.body.appendChild(ta);ta.select();try{document.execCommand("copy");alert("คัดลอกสำเร็จ ✔")}catch(e){alert("ล้มเหลว")}document.body.removeChild(ta)}
        function fillPreview(){const w=document.getElementById("preview-container");w.innerHTML="";const jd=getAllJobData();for(let i=0;i<jd.length;i+=4)w.appendChild(makePage(jd.slice(i,i+4)))}
        function makePage(j4){const w=document.createElement("div");w.className="page-wrap";for(let i=0;i<4;i++){const j=j4[i],s=document.createElement("div");s.className="slot";s.innerHTML=j?`<div class="line-top"><div>${j.id}</div><div>${j.time}</div><div>${j.date}</div></div><div class="passenger">${j.name}</div><div class="route">${shortName(j.pk)} → ${shortName(j.dp)}</div>${j.code?`<div class="code">${j.code}</div>`:""}`:"";w.appendChild(s)}return w}
        async function buildPDF(){const{jsPDF}=window.jspdf,ps=document.querySelectorAll(".page-wrap"),pdf=new jsPDF({orientation:"landscape",unit:"pt",format:[842,595]});for(let i=0;i<ps.length;i++){const c=await html2canvas(ps[i],{scale:2,useCORS:true,logging:false,windowWidth:1200});pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,842,595);if(i<ps.length-1)pdf.addPage()}return pdf}
        
        document.getElementById("btnProcess").onclick=async()=>{
            const v=document.getElementById("input").value.trim();if(!v)return;
            let cur=isAdmin?"Admin":prompt("ทะเบียนรถ:",PutterName);if(cur===null)return;PutterName=cur;localStorage.setItem("lastPutter",cur);
            renderShortOut();fillPreview();const jd=getAllJobData();jd.forEach(d=>{d.putter=cur;const f=new FormData();f.append('data',JSON.stringify(d));fetch(WEB_APP_URL,{method:'POST',body:f,mode:'no-cors'})});const ask=document.createElement("div");ask.style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.7);z-index:99999;display:flex;align-items:center;justify-content:center";ask.innerHTML=`<div style="background:white;padding:30px;border-radius:20px;width:85%;max-width:320px;text-align:center"><p style="font-size:20px;margin-bottom:25px;font-weight:600">${isAdmin?'🔓 Admin Mode':'🚗 ทะเบียน: '+cur}<br>คัดลอกงานย่อหรือไม่?</p><button id="btnYes" style="background:#28a745;color:white;width:100%;padding:16px;margin-bottom:12px;border-radius:12px;font-size:18px;border:none;font-weight:600">✂️ คัดลอก</button><button id="btnNo" style="background:#f8f9fa;color:#666;width:100%;padding:12px;border-radius:12px;font-size:15px;border:1px solid #ddd">ไม่คัดลอก</button></div>`;document.body.appendChild(ask);document.getElementById("btnYes").onclick=()=>{copyShort();document.body.removeChild(ask)};document.getElementById("btnNo").onclick=()=>{document.body.removeChild(ask)}};
        document.getElementById("btnPreviewSheet").onclick=fillPreview;
        document.getElementById("btnPDF").onclick=async()=>{const pdf=await buildPDF(),fn=(document.getElementById("input").value.match(/^([A-Z]\d{2,5})/m)||["","ใบงาน"])[1];pdf.save(fn+".pdf")};
        document.getElementById("btnSharePDF").onclick=async()=>{const pdf=await buildPDF(),fn=(document.getElementById("input").value.match(/^([A-Z]\d{2,5})/m)||["","ใบงาน"])[1],file=new File([pdf.output('blob')],fn+".pdf",{type:'application/pdf'});if(navigator.share)navigator.share({files:[file],title:'ใบงาน'});else alert("ไม่รองรับการแชร์")};
    </script>
</body>
</html>
