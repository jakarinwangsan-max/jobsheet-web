// YARN_OVERRIDE เน้นย่านสำคัญ/จุดสนใจ เพื่อให้แสดงผลเฉพาะเจาะจงกว่าชื่อเขต
const YARN_OVERRIDE = {
    "ทองหล่อ": /ทองหล่อ|thonglor/, "เอกมัย": /เอกมัย|ekkamai/, "อโศก": /อโศก|asoke|วัฒนา|watthana/,

};

// --- [ Functions for Logic ] ---
function MAP(t){
  t=t.toLowerCase();
  for(const [code, pattern] of Object.entries(LOC_MAP))
    if(pattern.test(t)) return code.length === 1 ? code : code; 
  return "BK"; 
}
function detectArea(text) {
  if (!text || text.trim() === "") return "กทม."; 
  const t = text.toLowerCase();
  for (const [area, keys] of Object.entries(BANGKOK_AREAS)) {
    if (area === "กทม.") continue;
    if (keys.some(k => t.includes(k.replace(/[|]/g, '')))) return area;
  }
  return "กทม.";
}
function getAreaForShort(text) {
  if (!text || text.trim() === "") return "ระบุพื้นที่"; 
  const t = text.toLowerCase();

  // 1. ตรวจสอบสนามบิน
  if (/dmk|don mueang|ดอนเมือง/.test(t)) return "แอร์ดอน";
  if (/bkk|suvarnabhumi|สุวรรณภูมิ/.test(t)) return "แอร์สุ";

  // 2. แผนผังคำแปล (บังคับภาษาไทย)
  const thaiMap = {
    'sathon': 'สาทร', 'ratchadamri': 'ราชดำริ', 'ratchada': 'รัชดา',
    'rama iv': 'พระราม 4', 'rama 4': 'พระราม 4', 'rama 3': 'พระราม 3',
    'rama iii': 'พระราม 3', 'rama vi': 'พระราม 6', 'rama 6': 'พระราม 6',
    'sukhumvit': 'สุขุมวิท', 'phloen chit': 'เพลินจิต', 'lumphini': 'ลุมพินี', 
    'king kaew': 'กิ่งแก้ว', 'lat phrao': 'ลาดพร้าว', 'bang rak': 'บางรัก',
    'silom': 'สีลม', 'sathorn': 'สาทร', 'phaya thai': 'พญาไท'
  };

  // 3. ระบบดึง "ซอย" และ "ถนน"
  const soiMatch = t.match(/(?:ซอย|ซ\.|soi)\s*([\d\/\-]+)/i);
  // เพิ่มการดักจับ Rama + ตัวเลข/เลขโรมัน
  const roadMatch = t.match(/(สุขุมวิท|ลาดพร้าว|รัชดา|พระราม\s*[\div\d]+|พหลโยธิน|กิ่งแก้ว|ราชดำริ|วิทยุ|สาทร|นราธิวาส|เพลินจิต|หลังสวน|บางรัก|sukhumvit|lat phrao|ratchada|rama\s*[\div\d]+|sathon|ratchadamri|king kaew|phloen chit|bang\s*rak)/i);

  if (soiMatch || roadMatch) {
      let roadName = roadMatch ? roadMatch[0].trim().toLowerCase() : "";
      const soiNum = soiMatch ? soiMatch[1] : "";

      // ค้นหาในแผนผังเพื่อเปลี่ยนเป็นภาษาไทย
      for (let key in thaiMap) {
          if (roadName.includes(key)) {
              roadName = thaiMap[key];
              break;
          }
      }
      
      // ถ้ายังเป็นภาษาอังกฤษอยู่ (กรณีนอกเหนือจาก Map) พยายามทำความสะอาด
      if (!/[ก-๙]/.test(roadName)) {
          roadName = roadName.replace('road', 'ถ.').replace('rd', 'ถ.');
      }

      return roadName + (soiNum ? " " + soiNum : "");
  }

  // 4. คืนค่าชื่อเขตภาษาไทยจาก detectArea (เลิกใช้ กทม.)
  const area = detectArea(text);
  if (area === "กทม.") {
      // ตรวจสอบย่านสำคัญเพิ่มเติมก่อนจะตัดสินใจใช้คำว่า "ในเมือง"
      for(const [yarn, pattern] of Object.entries(YARN_OVERRIDE)) {
          if(pattern.test(t)) return yarn;
      }
      return "ในเมือง";
  }
  
  return area;
}

function getCode(block){
  const raw=block.match(/【接驳编码code】(.*)/)||block.match(/code[:：]?\s*(.*)/i);
  if(!raw) return "";
  return raw[1].trim().match(/[0-9A-Za-z]+/)?.[0]||"";
}
function getAllJobData() {
    const raw = document.getElementById("input").value;
    if (!raw.trim()) return [];
    const blocks = raw.split(/(?=[A-Z]\d{2,5}-\d{1,2})/).filter(x => x.trim());
    const jobData = [];
    blocks.forEach(b => {
        const id = (b.match(/[A-Z]\d{2,5}-\d{1,2}/) || [""])[0];
        const time = (b.match(/【时间เวลา】(.*)/) || ["", ""])[1].trim();
        const flt = (b.match(/【航班flight】(.*)/) || ["", ""])[1].trim();
        const pk = (b.match(/【接รับ】(.*)/) || ["", ""])[1].trim();
        const dp = (b.match(/【送ส่ง】(.*)/) || ["", ""])[1].trim();
        const car = (b.match(/【车型ขนาดรถ】(.*)/) || ["", ""])[1].trim();
        const seat = /7\s*SEAT/i.test(car) ? 7 : 5; 
        const A = MAP(pk), B = MAP(dp);
        const areaA = getAreaForShort(pk);
        const areaB = getAreaForShort(dp);
        const date = (b.match(/【日期วันที่】(.*)/) || ["", ""])[1].trim();
        jobData.push({date: date, id: id, time: time, seat: seat, mapFrom: A, mapTo: B, areaFrom: areaA, areaTo: areaB, flight: flt, putter: PutterName });
    });
    return jobData;
}
async function sendToGoogleSheet(jobData) {
    if (jobData.length === 0) { alert("ไม่มีข้อมูลใบงานที่ประมวลผลได้"); return false; }
    const delay = ms => new Promise(res => setTimeout(res, ms));
    const results = [];
    for (const data of jobData) {
        const formData = new FormData();
        formData.append('data', JSON.stringify(data));
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                body: formData,
                mode: 'no-cors' 
            });
            results.push({ status: 'Sent', id: data.id });
            await delay(50); // หน่วง 50ms ต่องาน
        } catch (error) {
            console.error('Fetch Error:', error);
            results.push({ status: 'Error', id: data.id, error: error.message });
        }
    }
    const errorCount = results.filter(r => r.status === 'Error').length;
    if (errorCount === 0) { console.log(`Job data for ${jobData.length} jobs sent successfully. (Sent sequentially)`); } 
    else { alert(`⚠️ ส่งข้อมูลเสร็จสิ้น แต่มีข้อผิดพลาด ${errorCount} งาน (โปรดตรวจสอบ Apps Script Logs)`); }
    return true;
}
function parseShort(){
  const raw=document.getElementById("input").value;
  if(!raw.trim()) return "";
  const blocks=raw.split(/(?=[A-Z]\d{2,5}-\d{1,2})/).filter(x=>x.trim());
  let out="";
  let firstDate = "";
  if (blocks.length > 0) {
      const dateMatch = blocks[0].match(/【日期วันที่】(.*)/);
      firstDate = dateMatch ? dateMatch[1].trim() : "ไม่มีวันที่";
  }
  out += firstDate + "\n";
  out += "====================\n";
  const jobData = getAllJobData(); 
  jobData.forEach(job=>{
    out+=`${job.id}//${job.time}//#${job.seat}${job.mapFrom}-${job.mapTo}\n`;
    out+=`${job.areaFrom}–${job.areaTo}`;
    if(job.flight) out+=` ✈️${job.flight}`;
    out+=`\n\n`;
  });
  return out.trim();
}

}
function copyShort() {
  const shortEl = document.getElementById("short-out");
  const text = shortEl.innerText || shortEl.textContent;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { alert("คัดลอกแล้ว ✔"); })
    .catch(() => fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const textarea = document.createElement("textarea"); textarea.value = text; document.body.appendChild(textarea);
  textarea.select();
  try { document.execCommand("copy"); alert("คัดลอกแล้ว ✔"); }
  catch(e){ alert("คัดลอกไม่สำเร็จ ❌"); }
  document.body.removeChild(textarea);
}

// *** ฟังก์ชัน shortName ที่ปรับปรุงสำหรับการรองรับภาษาจีนและชื่อยาว ***
function shortName(n){ 
    if(!n) return ""; 
    let cleaned = n.replace(/http:\/\/googleusercontent\.com.*$/, '').trim();
    let textOnly = cleaned.split("(")[0].trim(); 
    
    if (textOnly.length < 5) {
        const addrMatch = cleaned.match(/(\d+\s*.*)/); 
        if (addrMatch) {
            cleaned = addrMatch[1].trim();
        } else {
            cleaned = textOnly;
        }
    } else {
        cleaned = textOnly;
    }
    
    const words = cleaned.match(/[\wก-๙\u4e00-\u9fff]+/g) || [];
    
    if (/[\u4e00-\u9fff]/.test(cleaned) && words.length === 1) {
        return cleaned.substring(0, 20); 
    }
    
    return words.slice(0, 3).join(" "); 
}

function splitJobs(t){ 
  let b=[],c=[]; 
  for(const l of t.split(/\n/).map(s=>s.trim())){ 
    if(/^[A-Z]\d{2,5}-\d{1,2}/.test(l)){ 
      if(c.length) b.push(c.join("\n")); c=[l]; 
    } else if(l) c.push(l); 
  } 
  if(c.length) b.push(c.join("\n")); 
  return b; 
}
function getVal(t,k){ const m=t.match(new RegExp("【"+k+"】([^\\n]*)")); return m?m[1].trim():""; }
